# pointcloud_to_laserscan.yaml
# Convert 3D point cloud (/ugv/rslidar_points) to 2D laser scan (/scan)
# —— Version 3: shorten range_max to 12m to match slam optimization and filter nearby vehicle noise

pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "rslidar"
    transform_tolerance: 0.05
  
    # 取 rslidar 周围 ±0.2m 的薄片压成 2D
    min_height: -0.15 #-0.2
    max_height: 0.15 #0.2

    # 360 degrees scaning
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00436  #0.0087
    scan_time: 0.1
    range_min: 0.35 #0.3
    # *** 关键改动:缩短到 12m,和 slam 的 max_laser_range 一致 ***
    range_max: 6.0 #12.0
    use_inf: true

    concurrency_level: 1
